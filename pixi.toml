[workspace]
name = "projectairsim"
version = "1.1.0"
description = "Project AirSim Client Environment"
authors = ["IAMAI Simulations"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
test-offline = { cmd = "pytest --sim-host offline -v test_json_schema.py test_datacollection/test_datacollector_config.py", cwd = "client/python/projectairsim/tests" }
hello-drone = { cmd = "python hello_drone.py", cwd = "client/python/example_user_scripts" }
hello-rover = { cmd = "python hello_rover.py", cwd = "client/python/example_user_scripts" }
hello-wheeled-vehicle = { cmd = "python hello_wheeled_vehicle.py", cwd = "client/python/example_user_scripts" }
keyboard-control = { cmd = "python keyboard_control.py", cwd = "client/python/example_user_scripts" }
lidar-gpu = { cmd = "python lidar_basic_gpu.py", cwd = "client/python/example_user_scripts" }

# --- SCBT: Self-Crystallizing Behavior Trees (research code, see scbt/) ---
scbt-runtime = { cmd = "python -m scbt.sim.launch_runtime", cwd = "scbt" }
scbt-episode = { cmd = "python -m scbt.bench.episode", cwd = "scbt" }
scbt-learn = { cmd = "python -m scbt.bench.learn", cwd = "scbt" }
scbt-frozen = { cmd = "python -m scbt.bench.frozen", cwd = "scbt" }
scbt-crystallize = { cmd = "python -m scbt.crystallize", cwd = "scbt" }
scbt-matrix = { cmd = "python -m scbt.bench.matrix", cwd = "scbt" }
scbt-report = { cmd = "python -m scbt.bench.report", cwd = "scbt" }
scbt-test = { cmd = "python -m pytest -q tests", cwd = "scbt" }

[dependencies]
python = "3.10.*"
pip = "*"
numpy = "*"
matplotlib = "*"
opencv = "*"
pytest = "*"
platformdirs = "*"
pyyaml = "*"

[pypi-dependencies]
projectairsim = { path = "client/python/projectairsim", editable = true }
commentjson = ">=0.9.0"
pynng = ">=0.5.0"
inputs = "*"
pqdict = "*"
pykml = "*"
junit-xml = "*"
jsonlines = "*"
Shapely = "*"
azure-storage-blob = "*"
albumentations = "==1.3.0"
open3d = ">=0.16.0"
# SCBT
scbt = { path = "scbt", editable = true }
py-trees = ">=2.2"
cma = ">=3.3"
google-adk = ">=2.0"
sentence-transformers = ">=3.0"
